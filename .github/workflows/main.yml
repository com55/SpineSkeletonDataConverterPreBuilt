name: Auto Build for SpineSkeletonDataConverter

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Upstream tag to build (leave empty to use latest release, and force a rebuild)'
        required: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.check.outputs.tag }}
      should_build: ${{ steps.check.outputs.should_build }}
    steps:
      - name: Determine tag and whether a build is needed
        id: check
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          else
            TAG=$(curl -s -H "Authorization: token $GH_TOKEN" https://api.github.com/repos/wang606/SpineSkeletonDataConverter/releases/latest | jq -r .tag_name)
          fi

          if [ "$TAG" == "null" ] || [ -z "$TAG" ]; then
            echo "No upstream release found."
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          if [ -n "$INPUT_TAG" ]; then
            echo "Manual run with explicit tag: forcing build."
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/$TAG")

          if [ "$STATUS" == "200" ]; then
            echo "Release $TAG already built, skipping."
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "New upstream release $TAG detected, building."
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          fi

  build-arm64:
    needs: check
    if: needs.check.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Upstream Code
        uses: actions/checkout@v4
        with:
          repository: wang606/SpineSkeletonDataConverter
          ref: ${{ needs.check.outputs.tag }}
          path: 'source-code'

      - name: Build inside Docker (Ubuntu 20.04 Env)
        uses: addnab/docker-run-action@v3
        with:
          image: ubuntu:20.04
          options: -v ${{ github.workspace }}:/work
          run: |
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y \
              build-essential cmake zip git file \
              gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

            cd /work/source-code

            rm -rf build
            mkdir build
            cd build

            cmake .. \
              -DCMAKE_SYSTEM_NAME=Linux \
              -DCMAKE_SYSTEM_PROCESSOR=aarch64 \
              -DCMAKE_C_COMPILER=aarch64-linux-gnu-gcc \
              -DCMAKE_CXX_COMPILER=aarch64-linux-gnu-g++ \
              -DCMAKE_EXE_LINKER_FLAGS="-static-libgcc -static-libstdc++"

            make -j$(nproc)

            mkdir -p ../../dist/arm64
            find . -maxdepth 1 -executable -type f -exec cp {} ../../dist/arm64/ \;

            ls -l ../../dist/arm64/
            file ../../dist/arm64/*

      - name: Package
        run: |
          if [ -d "dist/arm64" ]; then
            cd dist/arm64
            if [ -z "$(ls -A .)" ]; then
               echo "Error: Directory exists but is empty."
               exit 1
            fi
            zip -r ../../SpineSkeletonDataConverter-Linux-ARM64.zip *
          else
            echo "Build failed, no executable found."
            exit 1
          fi

      - name: Create/Update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.check.outputs.tag }}
          name: Release ${{ needs.check.outputs.tag }}
          body: "Auto-built from wang606/SpineSkeletonDataConverter for this tag. Includes Linux x64, Linux ARM64 (old GLIBC compatible) and Windows x64 builds."
          files: SpineSkeletonDataConverter-Linux-ARM64.zip
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux:
    needs: [check, build-arm64]
    if: needs.check.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Upstream Code
        uses: actions/checkout@v4
        with:
          repository: wang606/SpineSkeletonDataConverter
          ref: ${{ needs.check.outputs.tag }}
          path: 'source-code'

      - name: Build inside Docker (Ubuntu 20.04 Env)
        uses: addnab/docker-run-action@v3
        with:
          image: ubuntu:20.04
          options: -v ${{ github.workspace }}:/work
          run: |
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y \
              build-essential cmake zip git file

            cd /work/source-code

            rm -rf build
            mkdir build
            cd build

            cmake .. -DCMAKE_EXE_LINKER_FLAGS="-static-libgcc -static-libstdc++"

            make -j$(nproc)

            mkdir -p ../../dist/linux64
            find . -maxdepth 1 -executable -type f -exec cp {} ../../dist/linux64/ \;

            ls -l ../../dist/linux64/
            file ../../dist/linux64/*

      - name: Package
        run: |
          if [ -d "dist/linux64" ]; then
            cd dist/linux64
            if [ -z "$(ls -A .)" ]; then
               echo "Error: Directory exists but is empty."
               exit 1
            fi
            zip -r ../../SpineSkeletonDataConverter-Linux-x64.zip *
          else
            echo "Build failed, no executable found."
            exit 1
          fi

      - name: Create/Update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.check.outputs.tag }}
          name: Release ${{ needs.check.outputs.tag }}
          body: "Auto-built from wang606/SpineSkeletonDataConverter for this tag. Includes Linux x64, Linux ARM64 (old GLIBC compatible) and Windows x64 builds."
          files: SpineSkeletonDataConverter-Linux-x64.zip
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-windows:
    needs: [check, build-linux]
    if: needs.check.outputs.should_build == 'true'
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Upstream Code
        uses: actions/checkout@v4
        with:
          repository: wang606/SpineSkeletonDataConverter
          ref: ${{ needs.check.outputs.tag }}
          path: 'source-code'

      - name: Build
        run: |
          cd source-code
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release

      - name: Collect Binaries
        shell: bash
        run: |
          mkdir -p dist/windows
          find source-code/build -iname "*.exe" -exec cp {} dist/windows/ \;
          ls -l dist/windows

      - name: Package
        shell: bash
        run: |
          cd dist/windows
          if [ -z "$(ls -A .)" ]; then
            echo "Build failed, no executable found."
            exit 1
          fi
          7z a ../../SpineSkeletonDataConverter-Windows-x64.zip *

      - name: Create/Update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.check.outputs.tag }}
          name: Release ${{ needs.check.outputs.tag }}
          body: "Auto-built from wang606/SpineSkeletonDataConverter for this tag. Includes Linux x64, Linux ARM64 (old GLIBC compatible) and Windows x64 builds."
          files: SpineSkeletonDataConverter-Windows-x64.zip
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
